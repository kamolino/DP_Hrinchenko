<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR3 — výsledky dosahovania cieľa</title>
<style>
:root {color-scheme:light; --foreground:#182431; --background:#f6f8fa; --muted-foreground:#5c6b78; --border:#d5dde3; --viz-series-1:#087e70; --viz-series-2:#d34b39; --viz-series-3:#336fc4;}
*{box-sizing:border-box} body{margin:0;padding:28px 18px;background:var(--background);color:var(--foreground);font:16px/1.5 system-ui,sans-serif} #fr3-workspace-view{max-width:1100px;margin:auto} select,button{font:inherit;color:inherit;border:1px solid var(--border);background:white;border-radius:6px;padding:7px 10px} select{display:block;width:100%;margin-top:4px} button{cursor:pointer} button:hover{background:#e8eef4} input[type=range]{width:100%} .text-small{font-size:14px}.text-muted{color:var(--muted-foreground)}.tabular-nums{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="fr3-workspace-view">
  <style>
    #fr3-workspace-view .workspace-header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline; margin-bottom:12px; }
    #fr3-workspace-view .workspace-header h3 { margin:0; }
    #fr3-workspace-view .workspace-stage { position:relative; width:100%; margin:12px 0; }
    #fr3-workspace-view canvas { display:block; width:100%; height:430px; touch-action:pan-y; }
    #fr3-workspace-view .workspace-legend { display:flex; flex-wrap:wrap; gap:6px 16px; }
    #fr3-workspace-view .workspace-legend span { display:inline-flex; align-items:center; gap:6px; }
    #fr3-workspace-view .workspace-swatch { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--viz-series-1); }
    #fr3-workspace-view .workspace-swatch.failure { background:var(--viz-series-2); border-radius:0; transform:rotate(45deg); }
    #fr3-workspace-view .workspace-swatch.path { background:var(--viz-series-3); width:20px; height:3px; border-radius:0; }
    #fr3-workspace-view .workspace-swatch.target { background:transparent; width:10px; height:10px; border:2px solid var(--foreground); }
    #fr3-workspace-view .workspace-detail { min-height:1.5em; margin:8px 0; }
    #fr3-workspace-view .workspace-controls { display:grid; grid-template-columns: minmax(0,1fr) auto; gap:10px; align-items:end; }
    #fr3-workspace-view .workspace-playback { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
    #fr3-workspace-view .workspace-playback label { flex:1 1 220px; min-width:0; }
    #fr3-workspace-view .workspace-footer { margin-top:8px; }
    @media(max-width:480px) { #fr3-workspace-view canvas { height:365px; } #fr3-workspace-view .workspace-controls { grid-template-columns:minmax(0,1fr); } }
  </style>
  <div class="workspace-header"><h3>FR3 · Plánovač + DQN</h3><span class="text-small tabular-nums" data-summary></span></div>
  <div class="workspace-controls">
    <label class="form-label">Zaznamenaná trajektória <select class="form-select" data-episode aria-label="Vybrať zaznamenanú trajektóriu"></select></label>
    <label class="form-label">Projekcia <select class="form-select" data-projection aria-label="Projekcia pracovnej oblasti"><option value="3d">Priestorový pohľad</option><option value="xy">Zhora · XY</option><option value="xz">Zboku · XZ</option><option value="yz">Zboku · YZ</option></select></label>
  </div>
  <div class="workspace-stage"><canvas role="img" aria-label="Pracovná oblasť robota: testované ciele, zaznamenaná dráha TCP a polohy ramena. Kliknutie na cieľ zobrazí výsledok."></canvas></div>
  <div class="workspace-legend text-small"><span><i class="workspace-swatch" aria-hidden="true"></i>Úspech</span><span><i class="workspace-swatch failure" aria-hidden="true"></i>Neúspech</span><span><i class="workspace-swatch path" aria-hidden="true"></i>Dráha TCP</span><span><i class="workspace-swatch target" aria-hidden="true"></i>Vybraný cieľ</span></div>
  <div class="workspace-detail tabular-nums text-small" data-detail aria-live="polite"></div>
  <div class="workspace-playback"><button type="button" class="btn btn-primary" data-play>Prehrať</button><label class="form-label"><span data-time class="tabular-nums"></span><input class="form-range" data-frame type="range" min="0" max="1" value="0" step="1" aria-label="Poloha na zaznamenanej trajektórii"></label></div>
  <div class="workspace-footer text-small text-muted" data-footer></div>

      if(selected.p) {
        for(let i=1;i<selected.p.length;i++)line(selected.p[i-1],selected.p[i],col.path,1,.2);
        for(let i=1;i<=frame;i++)line(selected.p[i-1],selected.p[i],col.path,2.4,.9);
        if(selected.a) {
          const arm=selected.a[frame];
          for(let i=1;i<arm.length;i++)line(arm[i-1],arm[i],col.fg,w<450?4:5,.7);
          for(const joint of arm) {const p=project(joint);ctx.fillStyle=col.background;ctx.strokeStyle=col.fg;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(...p,3.5,0,Math.PI*2);ctx.fill();ctx.stroke();}
        }
        const tip=project(selected.p[frame]);ctx.fillStyle=col.path;ctx.beginPath();ctx.arc(...tip,5,0,Math.PI*2);ctx.fill();
        const error=Math.hypot(...selected.p[frame].map((p,i)=>p-selected.g[i]))*1000;
        timeLabel.textContent=`Krok ${selected.t[frame]} z ${selected.n} · chyba ${fmt(error,2)} mm`;
      } else timeLabel.textContent='Pre tento bod je zobrazený výsledok testu';
      const goal=project(selected.g);ctx.strokeStyle=col.fg;ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(...goal,7,0,Math.PI*2);ctx.stroke();
      line([0,0,0],[0,0,.02],col.fg,7);
      const rulerMeters = .2;
      const rulerWidth = rulerMeters*scale;
      if(rulerWidth<w*.35){ctx.strokeStyle=col.fg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(15,h-23);ctx.lineTo(15+rulerWidth,h-23);ctx.stroke();ctx.fillStyle=col.fg;ctx.textAlign='left';ctx.fillText('20 cm',15,h-10);}
    }
    function updateSelection(e) {
      selected=e;frame=0;playing=false;playButton.textContent='Prehrať';
      slider.max=e.p?e.p.length-1:0;slider.value=0;slider.disabled=!e.p;playButton.disabled=!e.p;
      if(e.p)episodeSelect.value=e.id;
      detail.textContent=`№ ${e.id+1} · ${e.s?'Dosiahnutý so zastavením a držaním':'Neúspech'}${e.c?' · kolízia':''} · konečná chyba ${fmt(e.e,2)} mm · XYZ ${e.g.map(p=>fmt(p,3)).join(' / ')} m`;
      draw();
    }
    episodeSelect.addEventListener('change',()=>updateSelection(data.episodes.find(e=>e.id===Number(episodeSelect.value))));
    projection.addEventListener('change',draw);
    slider.addEventListener('input',()=>{frame=Number(slider.value);playing=false;playButton.textContent='Prehrať';draw();});
    playButton.addEventListener('click',()=>{
      if(!selected.p)return;
      playing=!playing;if(playing&&frame>=selected.p.length-1)frame=0;
      previous=0;budget=0;playButton.textContent=playing?'Pauza':'Prehrať';
      if(playing)requestAnimationFrame(animate);
    });
    function animate(timestamp){
      if(!playing)return;
      if(previous)budget+=Math.min(timestamp-previous,100);previous=timestamp;
      if(budget>=90){budget=0;frame=Math.min(frame+1,selected.p.length-1);slider.value=frame;draw();}
      if(frame>=selected.p.length-1){playing=false;playButton.textContent='Prehrať';return;}
      requestAnimationFrame(animate);
    }
    canvas.addEventListener('click', event=>{
      const box=canvas.getBoundingClientRect();const x=event.clientX-box.left,y=event.clientY-box.top;
      let nearest=null, distance=23;
      for(const p of screenPoints){const d=Math.hypot(p.x-x,p.y-y);if(d<distance){distance=d;nearest=p.e;}}
      if(nearest)updateSelection(nearest);
    });
    const resize = new ResizeObserver(draw);resize.observe(canvas);
    new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
    updateSelection(selected);
  })();
  </script>
</div>
